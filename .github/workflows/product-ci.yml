name: Mosaid product CI
on:
  push:
    branches: [main, build/mosaid-product-foundation-20260729]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version: '1.25.13', cache: true}
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Module checksums
        run: go mod verify
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Linux AMD64 build
        run: go build -trimpath -o build/mosaid-linux-amd64 ./cmd/mosaid
      - name: Android ARM64 build
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -o build/mosaid-android-arm64 ./cmd/mosaid
      - name: Build checksums
        run: sha256sum build/mosaid-linux-amd64 build/mosaid-android-arm64 > build/SHA256SUMS
      - name: Secret scan
        run: bash phase0-android-runtime/scripts/scan-secrets.sh .
      - name: Reproducible SBOM verification
        run: |
          python3 scripts/generate-product-sbom.py --output build/product-sbom.cdx.json
          python3 scripts/verify-product-sbom.py --input build/product-sbom.cdx.json
          cmp security/product-sbom.cdx.json build/product-sbom.cdx.json
      - name: License verification
        run: |
          python3 scripts/generate-license-report.py --output build/product-license-report.tsv
          cmp security/product-license-report.tsv build/product-license-report.tsv
      - name: Clean-clone verification
        run: git diff --exit-code
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mosaid-product-${{ github.sha }}
          path: |
            build/mosaid-linux-amd64
            build/mosaid-android-arm64
            build/SHA256SUMS
            build/product-sbom.cdx.json
            build/product-license-report.tsv
          if-no-files-found: error
          retention-days: 14
