name: Mosaid product CI
on:
  push:
    branches: [main, build/mosaid-product-foundation-20260729]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version: '1.25.12', cache: true}
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o build/mosaid-linux-amd64 ./cmd/mosaid
      - run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -o build/mosaid-android-arm64 ./cmd/mosaid
      - run: bash phase0-android-runtime/scripts/scan-secrets.sh .
