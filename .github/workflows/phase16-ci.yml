name: Phase 16 CI — Digital Work Intelligence

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify modules
        run: go mod verify

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Unit tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Linux build
        run: GOOS=linux GOARCH=amd64 go build ./...

      - name: Android ARM64 build
        run: GOOS=linux GOARCH=arm64 go build ./...

      - name: Zero-cost policy test
        run: go test ./internal/model/providers/... -run TestCheckCostAllowed -v

      - name: Provider tier classification test
        run: go test ./internal/model/providers/... -run TestKaggleIsLocalSelfHosted -v

      - name: Work pack completeness test
        run: go test ./internal/cognitive/... -run TestDefaultWorkPacksComplete -v

      - name: Benchmark (mock)
        run: go test ./internal/benchmark/... -v

      - name: Clean tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree not clean:"
            git status
            exit 1
          fi
